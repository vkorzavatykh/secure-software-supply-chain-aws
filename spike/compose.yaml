# Local Dependency-Track v5 spike (P2-07 to P2-09): the topology of the AWS environment on one machine,
# with no AWS cost.
#
# - postgres stands in for RDS. It runs with a superuser only, and deployment/scripts/db-init.sh creates
#   the dtrack role and database, exactly as the instance bootstrap does against RDS (ADR-022).
# - apiserver connects as dtrack. Its database password and its key encryption key (KEK) are read from
#   mounted files through ${file::...}, so no secret value appears in the container's environment
#   (docker inspect) or in a command line (ADR-024).
# - Host ports match the instance: 8080 frontend, 8081 apiserver. Both bind to localhost only.
#
# The secret files in spike/secrets/ are generated by spike/run.sh and ignored by Git. Use spike/run.sh
# rather than calling docker compose directly; it runs db-init between the database and the apiserver.
name: sssc-spike

services:
  postgres:
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  apiserver:
    image: dependencytrack/apiserver:5.1.2@sha256:967213ebdca3f9ccb5a7ff9d85b7a0c7bfba4ca5a52467a940c072cc3123d14c
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dtrack
      DT_DATASOURCE_USERNAME: dtrack
      DT_DATASOURCE_PASSWORD: $${file::/run/secrets/db-password}
      DT_SECRET_MANAGEMENT_DATABASE_KEK: $${file::/run/secrets/kek}
      DT_TELEMETRY_SUBMISSION_DEFAULT_ENABLED: "false"
    secrets:
      - db-password
      - kek
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - apiserver-data:/data
    mem_limit: 2g
    restart: unless-stopped

  frontend:
    image: dependencytrack/frontend:5.1.2@sha256:69c36a0f4bfce9984e76ae5d56ed0b3e036e67c7e7505d8b52993d8c72d284de
    environment:
      API_BASE_URL: http://localhost:8081
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

secrets:
  postgres-password:
    file: ./secrets/postgres-password
  db-password:
    file: ./secrets/db-password
  kek:
    file: ./secrets/kek

volumes:
  postgres-data: {}
  apiserver-data: {}
